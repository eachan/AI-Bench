name: Build Windows Installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version"
        default: "0.1.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          .\installer\build_installer.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Package installer as zip
        shell: pwsh
        run: |
          $out = "installer\Output"
          Compress-Archive -Path "$out\AI-Bench-Setup.exe" -DestinationPath "$out\AI-Bench-Setup-${{ steps.ver.outputs.version }}.zip" -Force

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Bench-Setup-${{ steps.ver.outputs.version }}
          path: |
            installer/Output/AI-Bench-Setup.exe
            installer/Output/AI-Bench-Setup-*.zip
          if-no-files-found: error

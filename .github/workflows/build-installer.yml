name: Build Windows Installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version"
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          # Optional Authenticode signing. Add these as repository secrets to
          # produce a signed installer (avoids SmartScreen warnings). When
          # absent, the build still succeeds and produces an unsigned installer.
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          .\installer\build_installer.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload distribution file
        uses: actions/upload-artifact@v4
        with:
          # The single self-contained distribution zip users download & extract.
          name: AI-Bench-${{ steps.ver.outputs.version }}-windows-x64
          path: installer/Output/AI-Bench-${{ steps.ver.outputs.version }}-windows-x64.zip
          if-no-files-found: error

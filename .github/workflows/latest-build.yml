name: Publish release

# Every merge to main publishes a fresh, auto-versioned GitHub Release that is
# marked "Latest" — so new visitors always download the newest build, and the
# version number increments automatically. The in-app updater (which follows
# the latest non-prerelease) then also offers each new build to existing users.
#
# Version = <major.minor from backend/aibench/__init__.py>.<commit count>, e.g.
# 1.0.45. Bumping major/minor is as simple as editing __version__ in the repo.
#
# Because the Auto-merge step pushes to main with GITHUB_TOKEN (which does not
# trigger `push` workflows), this also runs off the Auto-merge workflow's
# completion.

on:
  workflow_run:
    workflows: ["Auto-merge"]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - name: Checkout main (full history for commit count)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute version
        id: ver
        shell: bash
        run: |
          base=$(grep -oE '[0-9]+\.[0-9]+' backend/aibench/__init__.py | head -1)
          patch=$(git rev-list --count HEAD)
          version="${base}.${patch}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing v$version"

      - name: Stamp version into the app
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          sed -i "s/^__version__ = .*/__version__ = \"$v\"/" backend/aibench/__init__.py
          (cd frontend && npm version "$v" --no-git-tag-version --allow-same-version)

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          .\installer\build_installer.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Stage stable-named asset
        shell: pwsh
        run: |
          $out = "installer\Output"
          # A version-independent name so the "latest" download URL never changes.
          Copy-Item "$out\AI-Bench-${{ steps.ver.outputs.version }}-windows-x64.zip" "$out\AI-Bench-windows-x64.zip" -Force

      - name: Publish Release (marked Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: AI-Bench ${{ steps.ver.outputs.version }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            installer/Output/AI-Bench-Setup.exe
            installer/Output/AI-Bench-windows-x64.zip
            installer/Output/AI-Bench-${{ steps.ver.outputs.version }}-windows-x64.zip
